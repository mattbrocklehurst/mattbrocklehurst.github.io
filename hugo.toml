baseURL = 'https://mattbrocklehurst.co.uk'
languageCode = 'en-gb'
title = 'Matt Brocklehurst' # This fixes the tab title
theme = 'terminal'

[params]
  # These are specific to the Terminal theme
  contentTypeName = "none"
  title = "Matt Brocklehurst"
  subtitle = "R&D engineer. I end up wherever software meets hardware that won't cooperate."
  owner = "Matt Brocklehurst"
  description = "Reverse-engineering, legacy hardware, and kernel-level debugging — OpenPnP, Zevatech, Armbian, and whatever's on fire this week."
  keywords = ["Systems Architect", "Burnley", "Reverse Engineering", "OpenPnP", "Industrial Automation"]

  # This section handles the "Terminal" appearance
  [params.terminal]
    showTitle = true
    showSubtitle = true


[menu]
  [[menu.main]]
    identifier = "home"
    name = "Home"
    url = "/"
    weight = 1  # Lowest weight = First position
  [[menu.main]]
    identifier = "missions"
    name = "The Missions"
    url = "/posts"
    weight = 10

  [[menu.main]]
    identifier = "github"
    name = "GitHub"
    url = "https://github.com/mattbrocklehurst"
    weight = 20
    [menu.main.params] # This matches the .Params.NewTab in your HTML
      NewTab = true
